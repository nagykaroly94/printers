
<script src="static/js/modal.js" defer></script>

<div id="listModal" class="modal">
    <div class="modal-content" style="width: 95%">
        <span class="close" onclick="closeListModal()">&times;</span>
        <h2>Nyomtatók</h2>
        
        <div class="search-wrapper">
            <input class="modalinput" type="text" id="searchInput" placeholder="Keresés..." oninput="filterTable()">
            <span class="clear-search" onmousedown="clearSearch(event)">×</span>
        </div>
        
        <table id="printerTable" style="width:100%; border-collapse: collapse;">
            <thead>
                <tr>
                    <th>Azonosító</th>
                    <th>Hely</th>
                    <th>IP</th>
                    <th>Típus</th>
                    <th>Gyári szám</th>
                    <th>Üzemeltető</th>
                    <th>Cím</th>
                    <th>Művelet</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        
        <div class="mfctnr">
            <button class="mfbtn" onclick="openModal()">Nyomtató hozzáadása</button>
            <div id="pagination"></div>
        </div>
        
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h3>Új nyomtató</h3>
        
        <form id="addForm" onsubmit="return false;">
            <label>Azonosító</label>
            <input class="modalinput" type="text" name="azonosito" required>
            
            <label>Gép helye</label>
            <input class="modalinput" type="text" name="gep_helye" required>
            
            <label>IP</label>
            <input class="modalinput" type="text" name="ip">
            
            <label>Típus</label>
            <input class="modalinput" type="text" name="tipus">
            
            <label>Gyári szám</label>
            <input class="modalinput" type="text" name="gyari_szam">
            
            <label>Üzemeltető</label>
            <select class="modalinput uzemelteto" name="uzemelteto">
                <option value="">Nincs megadva</option>
            </select>
            
            <label>Cím</label>
            <select class="modalinput cim" name="cim">
                <option value="">Nincs megadva</option>
            </select>
            
            <label>Csoport</label>
            <select class="modalinput csoport" name="csoport">
                <option value="">Nincs megadva</option>
            </select>
            
            <button type="submit">Mentés</button>
        </form>
    </div>
</div>

<div id="listModaltabla" class="modal">
    <div class="modal-content" style="width: 50%">
        <span class="close" onclick="closeListModaltabla()">&times;</span>
        <h2>Nyomtatók</h2>
        
        <div class="search-wrapper">
            <input class="modalinput" type="text" id="searchInputtablazat" placeholder="Keresés..." oninput="filterTabletablazat()">
            <span class="clear-search" onmousedown="clearSearchtablazat(event)">×</span>
        </div>
        
        <table id="printerTabletabla" style="width:100%; border-collapse: collapse;">
            <thead>
                <tr>
                    <th>Azonosító</th>
                    <th>Táblázat</th>
                    <th>Művelet</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>   
        <div class="mfctnr">
            <div id="tablazatPagination"></div>    
        </div>     
    </div>
</div>

<div id="manageModal" class="modal">
    <div class="modal-content" style="width: 75%">
        <div class="modal-header">
            <span class="close" onclick="closeManageModal()">✖</span>
            <h2 id="manageModalTitle"></h2>
        </div>
        
        <input class="modalinput" type="text" id="manageModalInput" placeholder="">
        <button onclick="saveManageModal()">Hozzáadás</button>
        
        <hr>
        
        <table>
            <tbody id="manageModalTable"></tbody>
        </table>
        <div class="mfctnr">
            <div id="manageModalPagination"></div>
        </div>
    </div>
</div>

<div id="relationsModal" class="modal">
    <div class="modal-content" style="width: 95%">
        <span class="close" onclick="closeRelationsModal()">&times;</span>
        <h2>Üzemeltető – Cím kapcsolatok</h2>
        
        <!-- Új kapcsolat hozzáadása -->
        <div class="search-wrapper" style="margin-bottom: 10px;">
            <select id="newRelationUzem" class="mfselect" style="padding: 10px;"></select>
            <select id="newRelationCim" class="mfselect" style="padding: 10px;"></select>
            <button class="mfbtn" onclick="saveNewRelation()">Hozzáadás</button>
        </div>
        
        <table id="relationTable" style="width:100%; border-collapse: collapse;">
            <thead>
                <tr>
                    <th>Üzemeltető</th>
                    <th>Cím</th>
                    <th>Művelet</th>
                </tr>
            </thead>
            <tbody id="relationTableBody">
                <!-- Dinamikusan töltődik -->
            </tbody>
        </table>
    </div>
</div>

<div class="modal" id="editPrinterModal" tabindex="-1">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title">Nyomtató szerkesztése</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
            <input type="text" id="printerId" placeholder="Azonosító">
            <input type="text" id="gepHelye" placeholder="Gép helye">
            <select id="tablazatSelect"></select>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-primary">Mentés</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Mégse</button>
        </div>
    </div>
</div>

<div id="csoportModal" class="modal">
    <div class="modal-content" style="width: 50%">
        <span class="close" onclick="closeCsoportModal()">&times;</span>
        <h2>Csoportok kezelése</h2>
        
        <!-- Új csoport hozzáadás -->
        <div class="search-wrapper" style="margin-bottom: 10px;">
            <input class="modalinput" type="text" id="newCsoportInput" placeholder="Csoport neve">
            <button class="mfbtn" onclick="addCsoport()">Hozzáadás</button>
        </div>
        
        <!-- Lista -->
        <table style="width:100%; border-collapse: collapse;">
            <thead>
                <tr>
                    <th>Csoport név</th>
                    <th>Művelet</th>
                </tr>
            </thead>
            <tbody id="csoportTableBody"></tbody>
        </table>
        <div class="mfctnr">
            <div id="csoportPagination"></div>
        </div>
    </div>
</div>
