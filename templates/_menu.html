<div class="hamburger" onclick="toggleMenu(this)">
    <div></div>
    <div></div>
    <div></div>
</div>

<div class="menu" id="hamburgerMenu">
    <button onclick="(toggleModal(),start())">
        Nyomtatók frissítése
    </button>
    
    {% if current_user.isadmin %}  
    {% if request.path == '/users' %}
    <button onclick="document.location='/'">
        Főoldal
    </button>
    {% else %}
    <button onclick="document.location='users'">
        Felhasználó kezelés
    </button>
    {% endif %}
    
    <button onclick="(toggleModal(),openModal())">
        Nyomtató hozzáadása
    </button>
    
    <button onclick="(toggleModal(),openListModaltabla())">
        Csoport kezelése
    </button>
    
    <button onclick="(toggleModal(),openCsoportModal())">
        Csoport hozzáadása
    </button>
    
    <button onclick="(toggleModal(),openManageModal('cim'))">
        Címek kezelése
    </button>
    
    <button onclick="(toggleModal(),openManageModal('uzemelteto'))">
        Üzemeltetők kezelése
    </button>
    
    <button onclick="(toggleModal(),openRelationsModal(1))">
        Kapcsolatok kezelése
    </button>
    {% endif %}
    
    <button onclick="(toggleModal(),saveMonthly())">
        Oldalszám rögzítése
    </button>
    
    <button onclick="(toggleModal(),window.open('/get_full_diff'))">
        Oldalszám exportálás
    </button>
    
    <form action="{{ url_for('logout') }}" method="GET">
        <button type="submit">
            Kijelentkezés
        </button>
    </form>
    
</div>
